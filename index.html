<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 브라우저 탭 아이콘 — 앱 아이콘과 같은 갈매기입니다(2026-09-19 사용자. 전에는 템플릿 기본값인
         보라색 번개가 떠 있었습니다). 앱 아이콘을 그대로 쓰지 않는 이유는 그쪽은 갈매기 둘레 여백이
         넓어서 16px 로 줄이면 실오라기처럼 보이기 때문입니다 — 사각형에 꽉 채운 전용 그림을 씁니다. -->
    <!-- /favicon.svg 를 **지우지 않고 갈매기로 바꿔** 둡니다(2026-09-19). 지웠더니 탭에 보라색 번개가
         그대로 남았습니다: 이 주소는 오래 쓰던 자리라 브라우저가 기억해 두는데, 파일을 없애면
         SPA 설정 탓에 그 주소가 404 가 아니라 **index.html** 을 돌려줘(/없는파일.svg 도 200) 브라우저가
         "그림이 바뀌었다"를 알아채지 못합니다. 같은 자리에 올바른 그림을 두는 편이 확실합니다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />

    <!-- 앱(원스토어 TWA)·홈 화면 추가용. 이름·아이콘·세로 고정·스플래시는 매니페스트가 정합니다.
         meta theme-color(흰색)는 모바일 브라우저 주소창 색이라 그대로 두고, 앱 상태표시줄 색은
         매니페스트의 theme_color(#00A1FF)가 씁니다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 손가락 확대(pinch)를 막습니다(2026-09-21 사용자) — 앱은 390 폭 틀을 창에 맞춰 통째로 키우므로
         더 확대해 봐야 잘린 부분만 보입니다. 시작화면이 1.8배로 확대돼 일부만 보이는 것을 사용자가 잡아냈습니다.
         ⚠️ `user-scalable=no` 는 **아이폰 사파리가 무시합니다**(iOS 10~) — src/index.css 의
         `touch-action: pan-x pan-y` 가 그쪽을 맡습니다. 둘이 한 쌍입니다(src/lib/pinchZoom.test.js).
         카카오 지도의 두 손가락 확대는 지도가 터치를 직접 처리하므로 그대로입니다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="거제 여행 코스와 구간마다 버스 노선·이동시간·배차 횟수를 공식 시간표 원문에서 찾아 알려줍니다."
    />
    <!-- 이름만 둡니다(2026-09-16 사용자 결정) — 「버스로 가는」은 배(외도·내도·지심도)를 빼놓는 말이라
         서비스를 좁게 설명했습니다. 무엇을 하는 앱인지는 아래 description 이 말합니다. -->
    <title>거제로</title>

    <!-- 링크 미리보기(2026-09-20 사용자) — 카카오톡 등에 주소를 보내면 뜨는 카드입니다. 전에는 제목만 뜨고
         그림·소개가 없어 카카오톡이 「여기를 눌러 링크를 확인하세요」로 채웠습니다.
         · 그림 주소는 **전체 주소**여야 합니다(상대 주소 `/og.png` 는 받아 가지 못합니다).
         · `og-2.png` 는 앱 아이콘의 갈매기 + 「거제로」 + 한 줄 소개(1200 × 630 — 카카오톡 · 슬랙 공통 크기).
         · 카카오톡은 주소마다 미리보기를 **한동안 기억합니다** — 그림을 바꾸면 파일 이름을 바꿔야 새로 받아 갑니다.
         · 주소가 어디든(SPA) 같은 카드가 뜹니다. 코스·스팟마다 다른 카드는 서버 렌더가 필요해 하지 않았습니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="거제로" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="거제로" />
    <meta
      property="og:description"
      content="거제시 원문 버스·배 시간표로 짜는 여행 코스"
    />
    <meta property="og:url" content="https://www.geojero.com/" />
    <meta property="og:image" content="https://www.geojero.com/og-2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="거제로 — 갈매기 로고" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Figma 텍스트 스타일 전부 Noto Sans KR (400·500·700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <link rel="preconnect" href="https://dapi.kakao.com" />

    <!-- 시작화면(2026-09-19) — 잠깐 스쳤다 사라지는 화면이라 자바스크립트가 뜬 뒤에 받기 시작하면 늦습니다.
         여기서 미리 당겨 두면 번들과 나란히 내려받습니다. 글꼴은 같은 출처라도 crossorigin 이
         있어야 preload 가 재사용됩니다(없으면 두 번 받습니다). -->
    <link rel="preload" as="image" href="/splash.webp" type="image/webp" />
    <link
      rel="preload"
      as="font"
      href="/fonts/BMDOHYEON.woff"
      type="font/woff"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
