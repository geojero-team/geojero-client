<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 앱(원스토어 TWA)·홈 화면 추가용. 이름·아이콘·세로 고정·스플래시는 매니페스트가 정합니다.
         meta theme-color(흰색)는 모바일 브라우저 주소창 색이라 그대로 두고, 앱 상태표시줄 색은
         매니페스트의 theme_color(#00A1FF)가 씁니다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="거제 뚜벅이 코스와 구간마다 버스 노선·이동시간·배차 횟수를 공식 시간표 원문에서 찾아 알려줍니다."
    />
    <!-- 이름만 둡니다(2026-09-16 사용자 결정) — 「버스로 가는」은 배(외도·내도·지심도)를 빼놓는 말이라
         서비스를 좁게 설명했습니다. 무엇을 하는 앱인지는 아래 description 이 말합니다. -->
    <title>거제로</title>

    <!-- Figma 텍스트 스타일 전부 Noto Sans KR (400·500·700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
    <link rel="preconnect" href="https://dapi.kakao.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
